<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diary 🌷</title>

<style>



* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  color: #4b2424;

  background:
    radial-gradient(
      circle at 50% 12%,
      #ffffff 0%,
      #fafafa 48%,
      #eeeeee 100%
    );
}




.glow {
  position: fixed;
  width: 480px;
  height: 480px;
  border-radius: 50%;
  background: rgba(255,255,255,.8);
  filter: blur(70px);
  top: -250px;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
}

.table {
  position: fixed;
  left: -5%;
  bottom: -7%;
  width: 110%;
  height: 56%;

  background:
    repeating-linear-gradient(
      90deg,
      rgba(70,35,20,.07) 0px,
      rgba(70,35,20,.07) 3px,
      transparent 3px,
      transparent 75px
    ),
    linear-gradient(
      180deg,
      #a66747,
      #78432e
    );

  box-shadow:
    inset 0 10px 30px rgba(40,15,5,.16),
    0 -10px 30px rgba(60,25,15,.14);

  transform:
    perspective(700px)
    rotateX(3deg);
}




.intro {
  position: fixed;
  top: 7%;
  left: 50%;
  width: 90%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 5;

  transition:
    opacity .7s ease,
    transform .7s ease;
}

.intro h1 {
  margin: 0;

  font-size:
    clamp(30px, 8vw, 48px);

  font-weight: normal;
  color: #762c38;
}

.intro p {
  margin: 10px 0 0;

  font-size:
    clamp(15px, 4vw, 19px);

  color: #713d3d;
}




.book-area {
  position: fixed;

  z-index: 10;

  left: 50%;
  top: 54%;

  width: min(195px, 44vw);
  height: min(300px, 67vw);

  transform:
    translate(-50%, -50%);

  transition:
    width 1.15s cubic-bezier(.16,1,.3,1),
    transform 1s cubic-bezier(.16,1,.3,1),
    opacity .7s ease;
}




.book-area.opened {
  width: min(390px, 88vw);
}




.book-area.diary-leaving {
  transform:
    translate(-50%, 125vh)
    rotate(-3deg);

  opacity: 0;

  pointer-events: none;
}




.book-shadow {
  position: absolute;

  left: 5%;
  top: 15%;

  width: 90%;
  height: 78%;

  border-radius: 20px;

  background:
    rgba(40,15,10,.42);

  filter: blur(18px);

  transform:
    translateY(22px);

  transition:
    width 1.15s cubic-bezier(.16,1,.3,1),
    opacity 1s ease,
    transform 1.15s ease;
}

.book-area.opened .book-shadow {
  width: 90%;
  transform: translateY(22px);
}




.book {
  position: absolute;
  inset: 0;

  perspective: 1800px;

  filter:
    drop-shadow(
      0 16px 14px rgba(50,20,10,.24)
    );

  transform-style: preserve-3d;

  touch-action: manipulation;
}




.book-shell {
  position: absolute;
  inset: 0;

  border-radius:
    8px 20px 20px 8px;

  background:
    linear-gradient(
      100deg,
      #300811,
      #4b101b 45%,
      #671c29
    );

  box-shadow:
    0 9px 15px rgba(40,10,10,.35),
    inset 0 0 0 2px rgba(255,220,190,.13);

  transform-origin: center center;

  transform:
    scaleX(.5);

  transition:
    transform 1.15s cubic-bezier(.16,1,.3,1);

  z-index: 1;
}

.book-area.opened .book-shell {
  transform: scaleX(1);
}




.book-shell::before {
  content: "";

  position: absolute;

  top: 5px;
  right: -5px;

  width: 7px;
  height: calc(100% - 10px);

  border-radius:
    0 8px 8px 0;

  background:
    repeating-linear-gradient(
      0deg,
      #e9d8bd 0px,
      #e9d8bd 3px,
      #c9b395 4px,
      #f4e8d3 6px
    );

  opacity: .9;

  box-shadow:
    2px 2px 5px rgba(30,10,5,.2);
}

.book-shell::after {
  content: "";

  position: absolute;

  left: 7px;
  right: 3px;
  bottom: -6px;

  height: 7px;

  border-radius:
    0 0 12px 12px;

  background:
    linear-gradient(
      180deg,
      #5b1724,
      #350a12
    );

  box-shadow:
    0 3px 5px rgba(30,10,5,.22);
}




.open-book {
  position: absolute;

  inset: 0;

  display: flex;

  gap: 5px;

  padding: 2px;

  border-radius:
    8px 18px 18px 8px;

  background:
    #e3d5c1;

  overflow: visible;

  opacity: 0;

  transform:
    scaleX(.5);

  transform-origin: center center;

  transition:
    opacity .25s ease,
    transform 1.15s cubic-bezier(.16,1,.3,1);

  z-index: 2;
}

.book-area.opened .open-book {
  opacity: 1;
  transform: scaleX(1);
}




.white-page {
  position: relative;

  flex:
    0 0 calc(50% - 2.5px);

  width:
    calc(50% - 2.5px);

  height: 100%;

  overflow: hidden;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 29px,
      rgba(120,80,50,.07) 30px
    ),
    #fffaf0;

  box-shadow:
    inset 0 0 20px rgba(80,40,20,.1);
}

.white-page.left {
  border-radius:
    8px 0 0 8px;
}

.white-page.right {
  border-radius:
    0 8px 8px 0;
}

.white-page.left::after {
  content: "";

  position: absolute;

  right: -4px;
  top: 0;

  width: 8px;
  height: 100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(60,30,20,.12)
    );

  pointer-events: none;
}

.white-page.right::before {
  content: "";

  position: absolute;

  left: -4px;
  top: 0;

  width: 8px;
  height: 100%;

  background:
    linear-gradient(
      90deg,
      rgba(60,30,20,.12),
      transparent
    );

  pointer-events: none;
}




.for-you-page {
  position: absolute;

  right: 2px;
  top: 2px;

  width:
    calc(50% - 4.5px);

  height:
    calc(100% - 4px);

  border-radius:
    0 8px 8px 0;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 29px,
      rgba(120,80,50,.07) 30px
    ),
    #fffaf0;

  box-shadow:
    inset 0 0 20px rgba(80,40,20,.1),
    -2px 0 5px rgba(60,30,20,.08);

  transform-origin:
    left center;

  transform-style:
    preserve-3d;

  backface-visibility:
    hidden;

  cursor: pointer;

  z-index: 30;

  transition:
    transform 1.2s
    cubic-bezier(.22,1,.36,1);
}

.open-book.page-turned .for-you-page {
  transform:
    rotateY(-180deg);

  pointer-events: none;
}

.for-you-front {
  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  backface-visibility:
    hidden;
}

.for-you-content {
  text-align: center;

  color: #6d4141;

  font-size:
    clamp(20px, 5.5vw, 29px);

  line-height: 1.5;

  padding: 15px;
}

.for-you-back {
  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 29px,
      rgba(120,80,50,.07) 30px
    ),
    #fffaf0;

  backface-visibility:
    hidden;

  transform:
    rotateY(180deg);
}

.for-you-back::after {
  content: "♡";

  color: #c69b9b;

  font-size: 28px;

  opacity: .45;
}




.book-spine {
  position: absolute;

  left: 50%;
  top: 2px;

  width: 5px;
  height: calc(100% - 4px);

  transform:
    translateX(-50%);

  background:
    linear-gradient(
      90deg,
      rgba(55,20,20,.16),
      rgba(255,255,255,.25),
      rgba(55,20,20,.14)
    );

  z-index: 35;

  pointer-events: none;

  opacity: 0;

  transition:
    opacity .6s ease;
}

.book-area.opened .book-spine {
  opacity: 1;
}




.closed-cover {
  position: absolute;

  inset: 0;

  border-radius:
    8px 20px 20px 8px;

  background:
    linear-gradient(
      100deg,
      #300811,
      #4b101b 45%,
      #671c29
    );

  box-shadow:
    0 9px 15px rgba(40,10,10,.35),
    inset 0 0 0 2px rgba(255,220,190,.13);

  transform-origin:
    right center;

  transform-style:
    preserve-3d;

  cursor: pointer;

  z-index: 50;

  transition:
    transform 1.15s
    cubic-bezier(.22,1,.36,1),
    opacity .15s ease;
}




.closed-cover::before {
  content: "";

  position: absolute;

  inset: 14px;

  border:
    1px solid rgba(255,220,190,.27);

  border-radius:
    4px 11px 11px 4px;
}




.closed-cover .closed-spine {
  position: absolute;

  left: 0;
  top: 0;

  width: 18%;
  height: 100%;

  border-radius:
    8px 0 0 8px;

  background:
    linear-gradient(
      90deg,
      #26070e,
      #571521,
      #3b0c15
    );

  box-shadow:
    inset -5px 0 8px rgba(0,0,0,.25);
}




.closed-cover-title {
  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  color: #efd7bd;

  font-family:
    "Palatino Linotype",
    "Book Antiqua",
    Georgia,
    serif;

  font-size:
    clamp(22px, 6vw, 31px);

  font-style: italic;

  font-weight: normal;

  letter-spacing:
    1.5px;

  text-shadow:
    0 2px 5px rgba(20,0,5,.35);

  transform:
    translateX(5%);

  pointer-events: none;
}




.closed-cover-edge {
  position: absolute;

  top: 5px;
  right: -5px;

  width: 7px;
  height: calc(100% - 10px);

  border-radius:
    0 8px 8px 0;

  background:
    repeating-linear-gradient(
      0deg,
      #e9d8bd 0px,
      #e9d8bd 3px,
      #c9b395 4px,
      #f4e8d3 6px
    );

  box-shadow:
    2px 2px 5px rgba(30,10,5,.2);
}




.book-area.opened .closed-cover {
  transform:
    rotateY(-180deg);

  opacity: 0;

  pointer-events: none;
}




.letter-spread {
  position: absolute;

  inset: 0;

  display: flex;

  gap: 5px;

  padding: 2px;

  background:
    #e3d5c1;

  opacity: 0;

  pointer-events: none;

  z-index: 60;

  overflow: visible;

  transition:
    opacity .25s ease;
}

.open-book.page-turned .letter-spread {
  opacity: 1;
  pointer-events: auto;
}




.spread-page {
  position: relative;

  width:
    calc(50% - 2.5px);

  flex:
    0 0 calc(50% - 2.5px);

  height: 100%;

  overflow: visible;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 29px,
      rgba(120,80,50,.07) 30px
    ),
    #fffaf0;

  box-shadow:
    inset 0 0 20px rgba(80,40,20,.1);

  z-index: 61;
}

.spread-page.left {
  border-radius:
    8px 0 0 8px;
}

.spread-page.right {
  border-radius:
    0 8px 8px 0;
}

.spread-page.left::after {
  content: "";

  position: absolute;

  right: -4px;
  top: 0;

  width: 8px;
  height: 100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(60,30,20,.1)
    );

  pointer-events: none;
}




.envelope {
  position: absolute;

  width: 57px;
  height: 39px;

  padding: 0;

  border:
    1px solid rgba(110,75,50,.18);

  border-radius: 5px;

  background:
    linear-gradient(
      145deg,
      #f1dfc5,
      #e2c8a7
    );

  box-shadow:
    0 4px 7px rgba(60,30,20,.17);

  cursor: pointer;

  transition:
    box-shadow .25s ease,
    opacity .35s ease,
    filter .25s ease;

  z-index: 70;

  display: block;
}

.envelope:hover {
  box-shadow:
    0 7px 13px rgba(60,30,20,.25);

  filter:
    brightness(1.04);
}




.envelope::before {
  content: "";

  position: absolute;

  left: 0;
  top: 0;

  width: 0;
  height: 0;

  border-left:
    28px solid transparent;

  border-right:
    28px solid transparent;

  border-top:
    20px solid #d5b691;

  z-index: 2;
}




.envelope::after {
  content: "";

  position: absolute;

  left: 5px;
  right: 5px;
  bottom: 5px;

  height: 17px;

  border-left:
    1px solid rgba(100,60,40,.2);

  border-right:
    1px solid rgba(100,60,40,.2);

  transform:
    skewY(-24deg);

  opacity: .7;
}




.envelope-heart {
  position: absolute;

  z-index: 5;

  left: 50%;
  top: 19px;

  transform:
    translateX(-50%);

  font-size: 13px;

  color: #8a3f4b;
}




.read-mark {
  position: absolute;

  right: -4px;
  bottom: -5px;

  z-index: 20;

  width: 20px;
  height: 20px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
    #7b3f4b;

  color: white;

  font-family:
    Arial,
    sans-serif;

  font-size: 11px;

  font-weight: bold;

  opacity: 0;

  transform:
    scale(.5);

  transition:
    opacity .3s ease,
    transform .3s ease;

  box-shadow:
    0 2px 5px rgba(50,20,10,.25);
}

.envelope.read .read-mark {
  opacity: 1;
  transform: scale(1);
}

.envelope.read {
  opacity: .82;
}




.left .envelope:nth-child(1) {
  left: 8%;
  top: 7%;
  transform: rotate(-7deg);
}

.left .envelope:nth-child(2) {
  left: 55%;
  top: 5%;
  transform: rotate(5deg);
}

.left .envelope:nth-child(3) {
  left: 25%;
  top: 20%;
  transform: rotate(-3deg);
}

.left .envelope:nth-child(4) {
  left: 64%;
  top: 27%;
  transform: rotate(7deg);
}

.left .envelope:nth-child(5) {
  left: 5%;
  top: 42%;
  transform: rotate(3deg);
}

.left .envelope:nth-child(6) {
  left: 48%;
  top: 43%;
  transform: rotate(-7deg);
}

.left .envelope:nth-child(7) {
  left: 19%;
  top: 60%;
  transform: rotate(5deg);
}

.left .envelope:nth-child(8) {
  left: 65%;
  top: 63%;
  transform: rotate(-4deg);
}

.left .envelope:nth-child(9) {
  left: 7%;
  top: 79%;
  transform: rotate(-2deg);
}

.left .envelope:nth-child(10) {
  left: 48%;
  top: 82%;
  transform: rotate(6deg);
}




.right .envelope:nth-child(1) {
  left: 48%;
  top: 6%;
  transform: rotate(5deg);
}

.right .envelope:nth-child(2) {
  left: 7%;
  top: 9%;
  transform: rotate(-4deg);
}

.right .envelope:nth-child(3) {
  left: 28%;
  top: 21%;
  transform: rotate(6deg);
}

.right .envelope:nth-child(4) {
  left: 64%;
  top: 27%;
  transform: rotate(-5deg);
}

.right .envelope:nth-child(5) {
  left: 4%;
  top: 42%;
  transform: rotate(3deg);
}

.right .envelope:nth-child(6) {
  left: 49%;
  top: 44%;
  transform: rotate(-6deg);
}

.right .envelope:nth-child(7) {
  left: 21%;
  top: 61%;
  transform: rotate(4deg);
}

.right .envelope:nth-child(8) {
  left: 66%;
  top: 63%;
  transform: rotate(-3deg);
}

.right .envelope:nth-child(9) {
  left: 7%;
  top: 79%;
  transform: rotate(5deg);
}

.right .envelope:nth-child(10) {
  left: 47%;
  top: 82%;
  transform: rotate(-5deg);
}




.book-back {
  position: absolute;

  left: 10px;
  bottom: 10px;

  z-index: 100;

  padding:
    8px 14px;

  border: none;

  border-radius: 20px;

  background:
    rgba(255,255,255,.92);

  color: #6d4141;

  font-family:
    Georgia,
    serif;

  font-size: 12px;

  box-shadow:
    0 3px 8px rgba(50,20,10,.18);

  cursor: pointer;

  opacity: 0;
  pointer-events: none;

  transition:
    opacity .3s ease,
    transform .2s ease;
}

.book-area.opened .book-back {
  opacity: 1;
  pointer-events: auto;
}

.book-back:hover {
  transform:
    translateY(-2px);
}




.letter-modal {
  position: fixed;

  inset: 0;

  z-index: 100;

  display: flex;

  justify-content: center;
  align-items: center;

  padding: 24px;

  background:
    rgba(60,35,30,.38);

  backdrop-filter:
    blur(7px);

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .45s ease;
}

.letter-modal.show {
  opacity: 1;
  pointer-events: auto;
}




.letter-paper {
  position: relative;

  width:
    min(390px, 90vw);

  max-height:
    82vh;

  padding:
    35px 27px 30px;

  overflow-y: auto;

  border-radius: 4px;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 29px,
      rgba(120,80,50,.07) 30px
    ),
    #fffaf0;

  box-shadow:
    0 20px 50px rgba(30,15,10,.3);

  transform:
    translateY(35px)
    scale(.92)
    rotate(-1deg);

  transition:
    transform .55s
    cubic-bezier(.22,1,.36,1);
}

.letter-modal.show .letter-paper {
  transform:
    translateY(0)
    scale(1)
    rotate(0);
}




.letter-paper::before {
  content: "";

  position: absolute;

  left: 14px;
  top: 14px;
  right: 14px;
  bottom: 14px;

  border:
    1px solid rgba(120,75,60,.16);

  pointer-events: none;
}




.letter-message {
  position: relative;

  z-index: 2;

  padding:
    8px 4px 10px;

  font-size:
    clamp(16px, 4.3vw, 19px);

  line-height: 1.8;

  color: #543737;

  white-space: pre-line;

  text-align: left;
}




.close-letter {
  position: sticky;

  float: right;

  top: 0;

  width: 34px;
  height: 34px;

  margin-top: -21px;
  margin-right: -15px;

  border: none;

  border-radius: 50%;

  background:
    #ead7bd;

  color: #6d4141;

  font-size: 18px;

  cursor: pointer;

  z-index: 5;
}




.skip-to-ending {
  display: none;

  position: fixed;

  right: 4%;
  bottom: 5%;

  z-index: 60;

  padding: 10px 20px;

  border: none;

  border-radius: 20px;

  background:
    #ead7bd;

  color: #6d4141;

  font-family: inherit;

  font-size: 14px;

  box-shadow:
    0 4px 10px rgba(60,25,15,.2);

  cursor: pointer;
}

.skip-to-ending.show {
  display: block;
}




.music-toggle {
  position: fixed;

  left: 4%;
  top: 4%;

  z-index: 210;

  width: 40px;
  height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: none;

  border-radius: 50%;

  background:
    #ead7bd;

  color: #6d4141;

  font-size: 17px;

  box-shadow:
    0 4px 10px rgba(60,25,15,.2);

  cursor: pointer;
}




.letter-progress {
  display: none;

  position: fixed;

  left: 50%;
  top: 4%;

  z-index: 60;

  width: min(220px, 60vw);
  height: 22px;

  transform:
    translateX(-50%);

  align-items: center;

  background:
    rgba(255,255,255,.35);

  border-radius: 14px;

  overflow: hidden;

  box-shadow:
    0 3px 8px rgba(60,25,15,.2);
}

.letter-progress.show {
  display: flex;
}

.letter-progress-fill {
  position: absolute;

  left: 0;
  top: 0;

  height: 100%;

  width: 0%;

  background:
    #ead7bd;

  border-radius: 14px;

  transition: width .4s ease;
}

.letter-progress-label {
  position: relative;

  width: 100%;

  text-align: center;

  font-size: 11px;
  font-weight: 600;

  color: #6d4141;

  z-index: 1;
}




.tap {
  position: fixed;

  z-index: 20;

  left: 50%;
  bottom: 7%;

  transform:
    translateX(-50%);

  color: #fff4eb;

  font-size:
    clamp(14px,4vw,18px);

  text-shadow:
    0 2px 5px rgba(50,20,10,.55);

  animation:
    breathe 2s ease-in-out infinite;

  transition:
    opacity .5s ease;
}

.tap.hidden {
  display: none;
}

@keyframes breathe {

  0%,100% {
    opacity: .6;

    transform:
      translateX(-50%)
      translateY(0);

const letterProgressLabel =
  document.getElementById("letterProgressLabel");

const totalLetters = 20;




function updateLetterProgress() {

  const readCount =
    document.querySelectorAll(
      ".envelope.read"
    ).length;

  const percent =
    (readCount / totalLetters) * 100;

  letterProgressFill.style.width =
    percent + "%";

  letterProgressLabel.textContent =
    readCount + "/" + totalLetters;

}




function toggleMusic(event) {

  event.stopPropagation();

  if (musicPlaying) {

    bgMusic.pause();

    musicPlaying = false;

    musicToggle.textContent = "🔇";

  } else {

    bgMusic.volume = .5;

    bgMusic.play().catch(
      function() {}
    );

    musicPlaying = true;

    musicToggle.textContent = "🎵";

  }

}




function playSfx(sound) {

  sound.currentTime = 0;

  sound.play().catch(
    function() {}
  );

}




closedCover.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    if (bookOpened) {
      return;
    }

    bookOpened = true;


    

    playSfx(sfxPage);

    if (!musicPlaying) {
      toggleMusic(event);
    }


    

    intro.style.opacity = "0";

    intro.style.transform =
      "translateX(-50%) translateY(-15px)";


    

    tap.classList.add("hidden");
    tap.style.display = "none";


    

    bookArea.classList.add("opened");

  }
);




function turnPage(event) {

  event.stopPropagation();

  if (!bookOpened) {
    return;
  }

  if (pageTurned) {
    return;
  }

  pageTurned = true;

  playSfx(sfxPage);

  openBook.classList.add("page-turned");

  skipToEnding.classList.add("show");

  letterProgress.classList.add("show");

}




function handleBookBack(event) {

  event.stopPropagation();


  

  if (
    letterModal.classList.contains("show")
  ) {

    letterModal.classList.remove("show");

    return;
  }


  

  if (pageTurned) {

    pageTurned = false;

    playSfx(sfxPage);

    openBook.classList.remove(
      "page-turned"
    );

    skipToEnding.classList.remove("show");

    letterProgress.classList.remove("show");

    return;
  }


  

  if (bookOpened) {

    bookOpened = false;

    pageTurned = false;

    playSfx(sfxPage);

    openBook.classList.remove(
      "page-turned"
    );

    skipToEnding.classList.remove("show");

    letterProgress.classList.remove("show");

    bookArea.classList.remove(
      "opened"
    );


    

    intro.style.opacity = "1";

    intro.style.transform =
      "translateX(-50%)";


    

    tap.style.display = "block";

    tap.classList.remove("hidden");

  }

}

function openLetter(number, event) {

  event.stopPropagation();

  if (!openBook.classList.contains("page-turned")) {
    return;
  }

  const letter =
    letters[number];

  if (!letter) {
    return;
  }


  

  currentLetterNumber = number;


  

  const envelope =
    event.currentTarget;

  playSfx(sfxEnvelope);

  envelope.classList.add("read");

  updateLetterProgress();


  

  letterMessage.textContent =
    letter.message;


  

  letterModal.classList.add("show");

}




function closeLetter(event) {

  event.stopPropagation();

  letterModal.classList.remove("show");

}




function goToEndingFromLetter(event) {

  event.stopPropagation();

  letterModal.classList.remove("show");

  setTimeout(
    startEnding,
    500
  );

  currentLetterNumber = null;

}




document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {

      if (
        letterModal.classList.contains("show")
      ) {

        letterModal.classList.remove(
          "show"
        );

        currentLetterNumber = null;

      }

    }

  }
);




function startEnding() {

  if (endingStarted) {
    return;
  }

  endingStarted = true;

  endingStageNumber = 0;

  selectedAnswer = null;


  

  openBook.classList.remove(
    "page-turned"
  );

  pageTurned = false;

  skipToEnding.classList.remove("show");


  

  setTimeout(
    function() {

      bookArea.classList.add(
        "diary-leaving"
      );

    },
    850
  );


  

  setTimeout(
    function() {

      ending.classList.add("show");

      resetEndingVisuals();

      setTimeout(
        function() {

          cat.classList.add("walking");

        },
        100
      );

      

      setTimeout(
        function() {

          cat.classList.remove(
            "walking"
          );

          cat.classList.add(
            "sitting"
          );

          questionStage.classList.add(
            "show"
          );

        },
        2900
      );

    },
    950
  );

}




function resetEndingVisuals() {

  questionStage.classList.remove(
    "show"
  );

  reactionStage.classList.remove(
    "show"
  );

  reactionNext.classList.remove(
    "show"
  );

  bouquet.classList.remove(
    "show",
    "accepted"
  );

  acceptButton.classList.remove(
    "show"
  );

  finalNote.classList.remove(
    "show"
  );

  finalNoteText.textContent = "";

  bouquetStage.classList.remove(
    "bouquet-stage"
  );

  cat.classList.remove(
    "sitting",
    "walking",
    "note-pull"
  );

}

    reactionText.textContent =
      "aww shucks anyway 😭";

  setTimeout(
    function() {

      reactionStage.classList.add(
        "show"
      );

      reactionNext.classList.add(
        "show"
      );

    },
    450
  );

}

      acceptButton.classList.add(

  );

}

  setTimeout(

  );

}




function showCakeStage() {

  cake.classList.add("show");

  tapBlow.classList.add("show");

  ending.addEventListener(
    "click",
    blowCandle
  );

}




function blowCandle(event) {

  ending.removeEventListener(
    "click",
    blowCandle
  );


  

  cakeFlame.classList.add("blown");

  speechBubble.classList.remove("show");

  tapBlow.classList.remove("show");


  

  setTimeout(
    function() {

      cake.classList.add("fade-out");

      cat.classList.add(
        "note-pull"
      );

      playSfx(sfxMeow);

      showFinalNote();

    },
    900
  );

}




function showFinalNote() {

  finalNote.classList.add(
    "show"
  );


  

  const noteText =
`Happy Birthday Harshita, have a good one.

     -By yours indo/ mr nri/ kiddo/ angreyz`;


  finalNoteText.textContent = "";

  let index = 0;

  clearInterval(
    noteTypingTimer
  );

  noteTypingTimer =
    setInterval(
      function() {

        finalNoteText.textContent +=
          noteText.charAt(index);

        index++;

        if (index >= noteText.length) {

          clearInterval(
            noteTypingTimer
          );

          replayLink.classList.add(
            "show"
          );

        }

      },
      42
    );

}




function endingBackAction() {

  

  if (endingStageNumber === 0) {

    returnToDiary();

    return;
  }


  

  if (endingStageNumber === 1) {

    endingStageNumber = 0;

    reactionStage.classList.remove(
      "show"
    );

    reactionNext.classList.remove(
      "show"
    );

    setTimeout(
      function() {

        questionStage.classList.add(
          "show"
        );

      },
      350
    );

    return;
  }


  

  if (endingStageNumber === 2) {

    endingStageNumber = 1;

    bouquet.classList.remove(
      "show"
    );

    acceptButton.classList.remove(
      "show"
    );

    bouquetStage.classList.remove(
      "bouquet-stage"
    );

    setTimeout(
      function() {

        reactionStage.classList.add(
          "show"
        );

        reactionNext.classList.add(
          "show"
        );

      },
      500
    );

    return;
  }


  

  if (endingStageNumber === 3) {

    endingStageNumber = 2;

    clearInterval(
      noteTypingTimer
    );

    finalNote.classList.remove(
      "show"
    );

    cat.classList.remove(
      "note-pull"
    );

    setTimeout(
      function() {

        bouquet.classList.remove(
          "accepted"
        );

        bouquet.classList.add(
          "show"
        );

        acceptButton.classList.add(
          "show"
        );

      },
      500
    );

  }

}




function returnToDiary() {

  ending.classList.remove(
    "show"
  );


  

  bookArea.classList.remove(
    "diary-leaving"
  );

  bookArea.classList.add(
    "opened"
  );

  bookOpened = true;

  pageTurned = false;

  openBook.classList.remove(
    "page-turned"
  );


  

  setTimeout(
    function() {

      endingStarted = false;

    },
    800
  );

}




document.getElementById(

);
